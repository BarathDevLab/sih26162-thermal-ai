services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sih26162
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih26162"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/sih26162
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      FIRMS_PRIMARY_SOURCE: VIIRS_NOAA20_NRT
      MODEL_STACK_VERSION: 2026-09-04-r1
      PRITHVI_ENABLED: ${PRITHVI_ENABLED:-false}
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      HLS_CACHE_DIR: /app/data/cache/hls
      ALLOW_SIMULATION: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgis_data:
